name: Oportunidades

on:
  workflow_dispatch:
  push:
    paths:
      - "config.json"
      - "scripts/oportunidades.js"
      - ".github/workflows/oportunidades.yml"
  schedule:
    - cron: "17,47 * * * *"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write

# Evita que duas coletas publiquem no mesmo branch ao mesmo tempo.
concurrency:
  group: oportunidades-main-write
  cancel-in-progress: false

jobs:
  oportunidades:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Executar coleta
        run: node scripts/oportunidades.js

      - name: Publicar JSON
        run: |
          git config user.name "GUIA COMERCIAL"
          git config user.email "guia-comercial-bot@users.noreply.github.com"
          git add data/oportunidades.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas oportunidades."
          else
            git commit -m "Atualizar oportunidades de emprego"
            # Sincroniza com commits feitos no GitHub antes de publicar; nunca força a atualização.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
